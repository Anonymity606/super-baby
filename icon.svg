<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="Pixel nuclear missile">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21172d"/>
      <stop offset="1" stop-color="#0f0b16"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-30%" width="200%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect x="6" y="6" width="244" height="244" rx="46" fill="none" stroke="#3b2b50" stroke-width="6"/>
  <g opacity=".28" fill="#0b0810">
    <rect x="22" y="40" width="212" height="4"/>
    <rect x="22" y="84" width="212" height="4"/>
    <rect x="22" y="128" width="212" height="4"/>
    <rect x="22" y="172" width="212" height="4"/>
    <rect x="22" y="216" width="212" height="4"/>
  </g>

  <!-- exhaust plume, drawn behind the missile -->
  <g transform="translate(48 16) scale(5)" filter="url(#glow)">
    <rect x="13" y="42" width="6" height="6" fill="#ff5a2e"/>
    <rect x="15" y="48" width="2" height="5" fill="#ffd45a"/>
    <rect x="10" y="41" width="3" height="4" fill="#ff9a2e"/>
    <rect x="19" y="41" width="3" height="4" fill="#ff9a2e"/>
  </g>

  <g transform="translate(48 16) scale(5)" shape-rendering="crispEdges">
    <!-- silhouette -->
    <path d="M16 0H19V2H21V4H23V7H25V23H29V26H28V36H24V32H23V41H9V32H8V36H3V26H2V23H7V7H9V4H11V2H13V0Z" fill="#18111f"/>
    <!-- warhead -->
    <path d="M16 1H18V3H20V5H22V8H23V9H9V8H10V5H12V3H14V1Z" fill="#e6463f"/>
    <path d="M16 1H18V3H20V5H21V7H16Z" fill="#ff8650"/>
    <!-- hull -->
    <rect x="8" y="9" width="16" height="23" fill="#f8e9cb"/>
    <rect x="20" y="9" width="4" height="23" fill="#d8bd8e"/>
    <rect x="10" y="9" width="2" height="23" fill="#fff8e7"/>
    <!-- cheerful danger face -->
    <rect x="11" y="12" width="3" height="2" fill="#18111f"/>
    <rect x="18" y="12" width="3" height="2" fill="#18111f"/>
    <rect x="14" y="15" width="4" height="1" fill="#18111f"/>
    <rect x="13" y="16" width="1" height="1" fill="#e6463f"/>
    <rect x="18" y="16" width="1" height="1" fill="#e6463f"/>
    <!-- radiation plate -->
    <rect x="10" y="18" width="12" height="9" fill="#18111f"/>
    <rect x="11" y="19" width="10" height="7" fill="#ffd54a"/>
    <rect x="15" y="21" width="2" height="2" fill="#18111f"/>
    <rect x="12" y="19" width="3" height="2" fill="#18111f"/>
    <rect x="17" y="19" width="3" height="2" fill="#18111f"/>
    <rect x="14" y="24" width="4" height="1" fill="#18111f"/>
    <!-- hazard band -->
    <rect x="8" y="29" width="16" height="3" fill="#18111f"/>
    <rect x="9" y="29" width="3" height="2" fill="#ffb52e"/>
    <rect x="14" y="29" width="3" height="2" fill="#ffb52e"/>
    <rect x="19" y="29" width="3" height="2" fill="#ffb52e"/>
    <!-- fins -->
    <path d="M3 26H8V35H4V33H3Z" fill="#e6463f"/>
    <path d="M29 26H24V35H28V33H29Z" fill="#c53334"/>
    <rect x="4" y="27" width="2" height="5" fill="#ff8650"/>
    <rect x="26" y="27" width="1" height="5" fill="#ff8650"/>
    <!-- nozzle -->
    <rect x="12" y="32" width="8" height="4" fill="#5d6676"/>
    <rect x="13" y="35" width="6" height="3" fill="#18111f"/>
    <rect x="15" y="37" width="2" height="1" fill="#ffd45a"/>
  </g>

  <!-- corner reticle -->
  <g fill="#7ef0ff" opacity=".85">
    <rect x="30" y="30" width="18" height="4"/>
    <rect x="30" y="30" width="4" height="18"/>
    <rect x="208" y="30" width="18" height="4"/>
    <rect x="222" y="30" width="4" height="18"/>
    <rect x="30" y="222" width="18" height="4"/>
    <rect x="30" y="208" width="4" height="18"/>
    <rect x="208" y="222" width="18" height="4"/>
    <rect x="222" y="208" width="4" height="18"/>
  </g>
</svg>
